server:
  port: ${SERVER_PORT:8080}
  tomcat:
    threads:
      max: ${SERVER_TOMCAT_THREADS_MAX:0}

spring:
  application:
    name: dealership
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dealership}
    username: ${SPRING_DATASOURCE_USERNAME:dealership}
    password: ${SPRING_DATASOURCE_PASSWORD:dealership}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL:0}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:5000}
      connection-init-sql: SET TIME ZONE 'UTC'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      username: ${SPRING_DATA_REDIS_USERNAME:}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      ssl:
        enabled: ${SPRING_DATA_REDIS_SSL_ENABLED:false}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    virtual-host: ${SPRING_RABBITMQ_VIRTUAL_HOST:/}
    ssl:
      enabled: ${SPRING_RABBITMQ_SSL_ENABLED:false}
    listener:
      simple:
        prefetch: 1
        concurrency: ${app.workers.concurrency}
        max-concurrency: 4
        acknowledge-mode: auto
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${SPRING_MAIL_AUTH:false}
      mail.smtp.starttls.enable: ${SPRING_MAIL_STARTTLS:false}
      mail.smtp.connectiontimeout: ${APP_MAIL_TIMEOUT_MS:20000}
      mail.smtp.timeout: ${APP_MAIL_TIMEOUT_MS:20000}
      mail.smtp.writetimeout: ${APP_MAIL_TIMEOUT_MS:20000}
management:
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
    metrics:
      access: read_only
    prometheus:
      access: read_only
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    mail:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true
    disable-swagger-default-url: true
    oauth:
      client-id: swagger

app:
  public-host: ${APP_PUBLIC_HOST:https://dealership.greatnerve.com}
  local-host: ${APP_LOCAL_HOST:http://localhost:8080}
  cors:
    origins: "${APP_CORS_ORIGINS:*}"
  jwt:
    secret: ${APP_JWT_SECRET:local-dev-only-change-me-32bytes-min!!}
    ttl: ${APP_JWT_TTL:7d}
  appointments:
    one-confirmed-per-vehicle: ${APP_ONE_CONFIRMED_PER_VEHICLE:true}
  reminders:
    no-show-grace: ${APP_NO_SHOW_GRACE:1h}
    offsets: "${APP_REMINDER_OFFSETS:24h,2h}"
  notifications:
    mode: ${APP_NOTIFICATIONS_MODE:stub}
    from: ${APP_MAIL_FROM:dheeraj@greatnerve.com}
    log-dir: ${APP_NOTIFICATIONS_LOG_DIR:logs}
  workers:
    concurrency: ${APP_WORKERS_CONCURRENCY:2}
    lease: ${APP_WORKERS_LEASE:30s}
    poll-interval: ${APP_WORKERS_POLL_INTERVAL:500ms}
    claim-batch: ${APP_WORKERS_CLAIM_BATCH:0}
  idempotency:
    ttl: ${APP_IDEMPOTENCY_TTL:24h}
  pagination:
    default-size: ${APP_PAGE_DEFAULT_SIZE:100}
    max-size: ${APP_PAGE_MAX_SIZE:1000}
    q-max: ${APP_PAGE_Q_MAX:100}
  rate-limit:
    enabled: ${APP_RATE_LIMIT_ENABLED:true}
    login-capacity: ${APP_RATE_LIMIT_LOGIN_CAPACITY:15}
    login-period: ${APP_RATE_LIMIT_LOGIN_PERIOD:60s}
    customer-capacity: ${APP_RATE_LIMIT_CUSTOMER_CAPACITY:15}
    customer-period: ${APP_RATE_LIMIT_CUSTOMER_PERIOD:60s}
    staff-capacity: ${APP_RATE_LIMIT_STAFF_CAPACITY:15}
    staff-period: ${APP_RATE_LIMIT_STAFF_PERIOD:60s}
    ip-capacity: ${APP_RATE_LIMIT_IP_CAPACITY:15}
    ip-period: ${APP_RATE_LIMIT_IP_PERIOD:60s}
    trust-forwarded-for: ${APP_RATE_LIMIT_TRUST_FORWARDED_FOR:false}
