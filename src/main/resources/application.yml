server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: dealership
  profiles:
    default: dev
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dealership}
    username: ${SPRING_DATASOURCE_USERNAME:dealership}
    password: ${SPRING_DATASOURCE_PASSWORD:dealership}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL:20}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:5000}
      connection-init-sql: SET TIME ZONE 'UTC'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        prefetch: 1
        concurrency: ${app.workers.concurrency}
        max-concurrency: 4
        acknowledge-mode: auto
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    properties:
      mail.smtp.connectiontimeout: ${APP_MAIL_TIMEOUT_MS:20000}
      mail.smtp.timeout: ${APP_MAIL_TIMEOUT_MS:20000}
      mail.smtp.writetimeout: ${APP_MAIL_TIMEOUT_MS:20000}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    mail:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true
    disable-swagger-default-url: true
    oauth:
      client-id: swagger

app:
  public-host: ${APP_PUBLIC_HOST:https://dealership.greatnerve.com}
  local-host: ${APP_LOCAL_HOST:http://localhost:8080}
  cors:
    origins: ${APP_CORS_ORIGINS:https://dealership.greatnerve.com,http://localhost:8080}
  security:
    jwt-required: true
  jwt:
    secret: ${APP_JWT_SECRET:local-dev-only-change-me-32bytes-min!!}
    ttl: ${APP_JWT_TTL:1d}
  appointments:
    one-confirmed-per-vehicle: ${APP_ONE_CONFIRMED_PER_VEHICLE:true}
  reminders:
    no-show-grace: ${APP_NO_SHOW_GRACE:1h}
    offsets: "${APP_REMINDER_OFFSETS:24h,2h}"
  notifications:
    mode: ${APP_NOTIFICATIONS_MODE:stub}
    from: ${APP_MAIL_FROM:noreply@dealership.greatnerve.com}
    log-dir: ${APP_NOTIFICATIONS_LOG_DIR:logs}
  workers:
    concurrency: ${APP_WORKERS_CONCURRENCY:2}
    lease: ${APP_WORKERS_LEASE:30s}
    poll-interval: ${APP_WORKERS_POLL_INTERVAL:500ms}
  idempotency:
    ttl: ${APP_IDEMPOTENCY_TTL:24h}
  pagination:
    default-size: ${APP_PAGE_DEFAULT_SIZE:100}
    max-size: ${APP_PAGE_MAX_SIZE:1000}
    q-max: ${APP_PAGE_Q_MAX:100}
  rate-limit:
    enabled: ${APP_RATE_LIMIT_ENABLED:true}
    login-capacity: ${APP_RATE_LIMIT_LOGIN_CAPACITY:5}
    login-period: ${APP_RATE_LIMIT_LOGIN_PERIOD:15m}
    customer-capacity: ${APP_RATE_LIMIT_CUSTOMER_CAPACITY:60}
    customer-period: ${APP_RATE_LIMIT_CUSTOMER_PERIOD:1m}
    staff-capacity: ${APP_RATE_LIMIT_STAFF_CAPACITY:300}
    staff-period: ${APP_RATE_LIMIT_STAFF_PERIOD:1m}
    ip-capacity: ${APP_RATE_LIMIT_IP_CAPACITY:600}
    ip-period: ${APP_RATE_LIMIT_IP_PERIOD:1m}
