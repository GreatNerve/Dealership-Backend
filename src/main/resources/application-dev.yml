spring:
  config:
    activate:
      on-profile: dev
  flyway:
    locations: classpath:db/migration,classpath:db/demo

app:
  appointments:
    one-confirmed-per-vehicle: ${APP_ONE_CONFIRMED_PER_VEHICLE:false}
  rate-limit:
    login-capacity: ${APP_RATE_LIMIT_LOGIN_CAPACITY:15}
    login-period: ${APP_RATE_LIMIT_LOGIN_PERIOD:60s}
    customer-capacity: ${APP_RATE_LIMIT_CUSTOMER_CAPACITY:15}
    customer-period: ${APP_RATE_LIMIT_CUSTOMER_PERIOD:60s}
    staff-capacity: ${APP_RATE_LIMIT_STAFF_CAPACITY:15}
    staff-period: ${APP_RATE_LIMIT_STAFF_PERIOD:60s}
    ip-capacity: ${APP_RATE_LIMIT_IP_CAPACITY:15}
    ip-period: ${APP_RATE_LIMIT_IP_PERIOD:60s}
