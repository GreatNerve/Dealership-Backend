services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dealership}
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME:-dealership}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-dealership}
    ports:
      - "5432:5432"
    cpus: 2.0
    mem_limit: 2g
    shm_size: 256m
    command: ["postgres", "-c", "max_connections=100", "-c", "shared_buffers=256MB"]
    volumes:
      - dealership_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    cpus: 1.0
    mem_limit: 1g
    environment:
      RABBITMQ_DEFAULT_USER: ${SPRING_RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${SPRING_RABBITMQ_PASSWORD:-guest}
    volumes:
      - dealership_rabbit:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    cpus: "0.5"
    mem_limit: 256m
    volumes:
      - dealership_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dealership_pg:
  dealership_rabbit:
  dealership_redis:
